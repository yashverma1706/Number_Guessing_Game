<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <main class="app-container">

        <!-- Header -->
        <header class="hero">
            <div class="logo">🎯</div>

            <h1>Number Guessing Game</h1>

            <p>
                Test your intuition. Outsmart the computer.
                <br>
                Guess smarter, score higher.
            </p>
        </header>


        <!-- Game Modes -->
        <section class="game-modes">

            <h2>Choose Game Mode</h2>

            <div class="mode-grid">

                <!-- Single Player -->
                <button class="mode-card" data-mode="single_player">

                    <span class="mode-icon">👤</span>

                    <span class="mode-title">
                        Single Player
                    </span>

                    <span class="mode-description">
                        Guess the number generated by the computer.
                    </span>

                </button>


                <!-- Two Player -->
                <button class="mode-card" data-mode="two_player">

                    <span class="mode-icon">👥</span>

                    <span class="mode-title">
                        Two Player
                    </span>

                    <span class="mode-description">
                        Challenge another player in two rounds.
                    </span>

                </button>


                <!-- Player vs Computer -->
                <button
                    class="mode-card"
                    data-mode="player_vs_computer"
                >

                    <span class="mode-icon">🤖</span>

                    <span class="mode-title">
                        Player vs Computer
                    </span>

                    <span class="mode-description">
                        Choose a number and watch the computer
                        find it.
                    </span>

                </button>

            </div>

        </section>


        <!-- Game Settings -->
        <section class="settings-card">

            <h2>⚙️ Game Settings</h2>

            <div class="range-settings">

                <div class="input-group">

                    <label for="range-min">
                        Minimum
                    </label>

                    <input
                        type="number"
                        id="range-min"
                        value="1"
                        min="1"
                    >

                </div>


                <span class="range-separator">to</span>


                <div class="input-group">

                    <label for="range-max">
                        Maximum
                    </label>

                    <input
                        type="number"
                        id="range-max"
                        value="100"
                        min="2"
                    >

                </div>

            </div>

        </section>


        <!-- Quick Stats -->
        <section class="quick-links">

            <button id="stats-button" class="secondary-button">
                📊 Statistics
            </button>

            <button id="history-button" class="secondary-button">
                📜 Game History
            </button>

        </section>


        <!-- Footer -->
        <footer>

            <p>
                Number Guessing Game
                <span>•</span>
                Built with Python + Flask
            </p>

        </footer>

    </main>


    <script
        src="{{ url_for('static', filename='js/app.js') }}"
    ></script>

</body>
</html>
